# CI para el proyecto Flutter + Firebase Functions (AndiCrochett)
#
# Este pipeline:
# - Valida formato y análisis estático
# - Ejecuta pruebas Flutter con cobertura
# - Compila Android App Bundle
# - Compila aplicación Web
# - Ejecuta CI para Cloud Functions
#
# Recomendaciones aplicadas:
# - Uso de JDK 17
# - Eliminado flutterfire configure en CI
# - Validación de formato Dart
# - Cache de pub
# - Optimización general

name: CI AndiCrochett

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  analizar_y_probar:
    name: Analizar y Probar (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4. Cache de dependencias Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 5. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 6. Validar formato Dart
        run: dart format --output=none --set-exit-if-changed .

      - name: 7. Analizar código fuente
        run: flutter analyze

      - name: 8. Ejecutar pruebas y generar cobertura
        # -j 1:
        # Los tests de integración comparten SQLite,
        # así que se ejecutan en serie para evitar conflictos.
        run: flutter test --coverage -j 1

      - name: 9. Subir artefacto de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-lcov
          path: coverage/lcov.info

  compilar_android:
    name: Compilar para Android
    needs: analizar_y_probar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4. Cache de dependencias Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 5. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 6. Compilar Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: 7. Subir artefacto Android (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/*.aab

  compilar_web:
    name: Compilar para Web
    needs: analizar_y_probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 3. Cache de dependencias Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 4. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 5. Compilar aplicación web
        run: flutter build web

      - name: 6. Subir artefacto Web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  ci_functions:
    name: CI para Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: functions

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar Linter
        run: npm run lint --if-present

      - name: 5. Ejecutar pruebas
        run: npm test --if-present