# CI para el proyecto de Flutter (AndiCrochett)
#
# Este pipeline valida el código de la aplicación Flutter y las Cloud Functions.
# Se estructura en los siguientes trabajos (jobs):
#
# 1. `analizar_y_probar`:
#    - Configura el entorno de Flutter y Java.
#    - Instala dependencias.
#    - Ejecuta `flutter analyze` para un análisis estático del código.
#    - Ejecuta pruebas unitarias y de widgets con `flutter test`, generando un reporte de cobertura.
#    - Sube el reporte de cobertura como un artefacto.
#
# 2. `compilar_android`:
#    - Depende de que `analizar_y_probar` termine con éxito.
#    - Compila el Android App Bundle (AAB) para producción.
#    - Sube el AAB como un artefacto para despliegue o pruebas.
#
# 3. `compilar_web`:
#    - Depende de que `analizar_y_probar` termine con éxito.
#    - Compila la aplicación web.
#    - Sube el directorio `build/web` como un artefacto.
#
# 4. `ci_functions`:
#    - Configura el entorno de Node.js.
#    - Instala dependencias de las Cloud Functions usando `npm ci`.
#    - Ejecuta el linter y las pruebas para las funciones.
#
name: CI AndiCrochett

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analizar_y_probar:
    name: Analizar y Probar (Flutter)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java (JDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2' # Fija una versión estable de Flutter
          channel: 'stable'
          cache: true

      - name: 4. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 5. Analizar código fuente
        run: flutter analyze

      - name: 6. Ejecutar pruebas y generar cobertura
        # -j 1: los tests de integracion comparten el archivo SQLite, asi que
        # se corren en serie para evitar races entre isolates.
        run: flutter test --coverage -j 1

      - name: 7. Subir artefacto de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-lcov
          path: coverage/lcov.info

  compilar_android:
    name: Compilar para Android
    needs: analizar_y_probar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java (JDK 11)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 4. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 5. Compilar Android App Bundle (AAB)
        run: flutter build appbundle

      - name: 6. Subir artefacto de Android (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/*.aab

  compilar_web:
    name: Compilar para Web
    needs: analizar_y_probar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: 3. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 4. Compilar aplicación web
        run: flutter build web --no-tree-shake-icons

      - name: 5. Subir artefacto web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  ci_functions:
    name: CI para Cloud Functions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: 'functions/package.json' # Lee la versión desde package.json
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar Linter
        run: npm run lint --if-present

      - name: 5. Ejecutar pruebas
        run: npm test
