# CI para el proyecto AndiCrochett.
#
# Este pipeline ejecuta en paralelo (cuando es posible):
#   - Análisis y tests del cliente Flutter
#   - Build de Android (AAB) y Web
#   - Tests del backend Node.js (smoke + integración contra SQLite local en CI)
#   - CI de las Cloud Functions legadas
#
# Notas:
#   - Java 17 y Flutter stable.
#   - Tests Flutter ya no requieren `-j 1`: con la migración al backend REST,
#     los tests de integración contra SQLite local fueron removidos.
#   - El job del backend usa un archivo SQLite temporal y NODE_ENV=test
#     activa el bypass de auth en backend/src/auth.js.

name: CI AndiCrochett

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analizar_y_probar_flutter:
    name: Flutter — Analizar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4. Cache de dependencias Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 5. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 6. Validar formato Dart
        run: dart format --output=none --set-exit-if-changed .

      - name: 7. Analizar código fuente
        run: flutter analyze

      - name: 8. Ejecutar pruebas y generar cobertura
        run: flutter test --coverage

      - name: 9. Subir artefacto de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura-lcov
          path: coverage/lcov.info

  probar_backend:
    name: Backend — Tests (Node + SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar tests
        run: npm test
        env:
          NODE_ENV: test

  compilar_android:
    name: Flutter — Compilar Android
    needs: analizar_y_probar_flutter
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 3. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 4. Cache de dependencias Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 5. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 6. Compilar Android App Bundle (AAB)
        # En CI no se inyecta BASE_URL: el AAB queda apuntando al backend de
        # desarrollo. Cuando definas un backend de producción, agrégalo aquí:
        #   --dart-define=BASE_URL=https://tu-api.com/api
        run: flutter build appbundle --release

      - name: 7. Subir artefacto Android (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: build/app/outputs/bundle/release/*.aab

  compilar_web:
    name: Flutter — Compilar Web
    needs: analizar_y_probar_flutter
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 3. Cache de dependencias Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 4. Instalar dependencias de Flutter
        run: flutter pub get

      - name: 5. Compilar aplicación web
        run: flutter build web

      - name: 6. Subir artefacto Web
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  ci_functions:
    name: Cloud Functions legadas — CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Job heredado del backend anterior basado en Firebase Cloud Functions.
    # Se mantiene por compatibilidad mientras el código de `functions/` siga
    # desplegado. Cuando termines la migración al backend Node, elimina este
    # job y el directorio `functions/`.

    defaults:
      run:
        working-directory: functions

    steps:
      - name: 1. Checkout del código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: functions/package.json
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: 3. Instalar dependencias
        run: npm ci

      - name: 4. Ejecutar Linter
        run: npm run lint --if-present

      - name: 5. Ejecutar pruebas
        run: npm test --if-present
