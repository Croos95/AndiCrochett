name: andicrochett
description: "Proyecto fullstack enfocado en el desarrollo de una plataforma web para una microempresa de crochet, que integra un entorno público (landing opcional, catálogo y contacto) y un panel administrativo con gestión de inventario y agenda para optimizar la organización y control del negocio."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  provider: ^6.1.2
  go_router: ^14.0.0
  google_sign_in: ^7.2.0
  http: ^1.2.0
  path: ^1.8.3
  path_provider: ^2.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
        - asset: assets/fonts/Lora-Italic.ttf
          style: italic
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lora-BoldItalic.ttf
          weight: 700
          style: italic
